    <!-- Performance optimizations -->
    <script>
      // Critical CSS and performance hints
      if ('connection' in navigator) {
        const connection = navigator.connection;
        if (connection.effectiveType === 'slow-2g' || connection.effectiveType === '2g') {
          document.documentElement.classList.add('slow-connection');
        }
      }
      
      // Preload critical resources based on user interaction
      const preloadOnHover = (href) => {
        const link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = href;
        document.head.appendChild(link);
      };
      
      // Add hover prefetch for country links
      document.addEventListener('DOMContentLoaded', () => {
        const countryLinks = document.querySelectorAll('[data-country-code]');
        countryLinks.forEach(link => {
          link.addEventListener('mouseenter', () => {
            const country = link.dataset.countryCode;
            const year = new Date().getFullYear();
            const lang = document.documentElement.lang;
            preloadOnHover(`/${lang}/country/${country}/${year}.html`);
          }, { once: true });
        });
      });
    </script>
